<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fig. 3.8 – Lake Michigan Dune Successions</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #fff; color: #222; }

  figure.figure-break {
    background: #f4f7f4;
    border-radius: 8px;
    padding: 20px;
    margin: 30px 0;
  }

  .fig-controls {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    margin-bottom: 10px; font-size: 13px;
  }
  .fig-controls strong { color: #2f5d3a; font-size: 12px; margin-right: 2px; }
  .fig-controls button {
    padding: 4px 11px; font-size: 12px; border: 1px solid #b0c4b0;
    border-radius: 4px; background: #fff; cursor: pointer; transition: background 0.15s;
  }
  .fig-controls button:hover { background: #e8f3e8; border-color: #2f5d3a; }
  .fig-controls button.active { background: #2f5d3a; color: #fff; border-color: #2f5d3a; }

  .legend {
    display: flex; flex-wrap: wrap; gap: 6px 16px;
    font-size: 11px; color: #555; margin-bottom: 10px;
  }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .lsw { width: 18px; height: 10px; border-radius: 2px; border: 1px solid rgba(0,0,0,0.18); display: inline-block; }

  #fig38-tip {
    position: fixed; background: #1a2e1a; color: #fff;
    font-size: 12px; padding: 5px 10px; border-radius: 5px;
    pointer-events: none; opacity: 0; transition: opacity 0.1s;
    z-index: 9999; max-width: 210px; line-height: 1.35;
  }
  #fig38-panel {
    display: none; background: #fff; border: 1px solid #c0d4c0;
    border-radius: 6px; padding: 11px 14px; margin-top: 10px;
    font-size: 13px; line-height: 1.6; color: #222; position: relative;
  }
  #fig38-panel.open { display: block; }
  #fig38-panel strong { color: #2f5d3a; display: block; margin-bottom: 3px; }
  #panel-close {
    position: absolute; top: 7px; right: 11px;
    cursor: pointer; font-size: 17px; color: #aaa; line-height: 1;
  }
  #panel-close:hover { color: #333; }

  /* SVG interactivity */
  .n { cursor: pointer; }
  .n rect, .n ellipse { transition: filter 0.12s; }
  .n:hover rect, .n:hover ellipse { filter: brightness(0.84); }
  .n.sel rect, .n.sel ellipse { stroke: #c0392b !important; stroke-width: 2px !important; }

  .al { transition: opacity 0.18s, stroke 0.18s, stroke-width 0.18s; }
  .al.dim { opacity: 0.08; }
  .al.hi  { stroke: #d35400 !important; stroke-width: 2.2px !important; opacity: 1 !important; }

  figcaption {
    margin-top: 12px; font-size: 13px; font-style: italic;
    color: #555; line-height: 1.5;
  }
  figcaption strong { font-style: normal; }
</style>
</head>
<body>

<figure class="figure-break" id="fig-3-8">

  <div class="fig-controls">
    <strong>Highlight pathway:</strong>
    <button onclick="hilite('damp')"    id="b-damp">Damp depression</button>
    <button onclick="hilite('upper')"   id="b-upper">Upper beach / Foredune</button>
    <button onclick="hilite('blowout')" id="b-blowout">Blowout</button>
    <button onclick="hilite('lee')"     id="b-lee">Lee slopes</button>
    <button onclick="hilite(null)"      id="b-all" class="active">Show all</button>
  </div>

  <div class="legend">
    <span><span class="lsw" style="background:#e4efe4"></span>Initial conditions</span>
    <span><span class="lsw" style="background:#d6e8d6;border-radius:50%"></span>Physiographic</span>
    <span><span class="lsw" style="background:#eaf4ea"></span>Pioneer vegetation</span>
    <span><span class="lsw" style="background:#e6ecf4"></span>Conifers</span>
    <span><span class="lsw" style="background:#f0f0f0"></span>'Climax' dominants</span>
    <span>——→ Direct succession &nbsp; - - → Alternative/reversible</span>
  </div>

  <!--
  ═══════════════════════════════════════════════════════
  COORDINATE SYSTEM  viewBox="0 0 1050 660"
  Left label column: x 0–110  |  Divider line: x=110
  Content: x=114 → x=1040

  ROW Y-BANDS (top of node → bottom of node):
    R1 Initial conditions:    y  46 – 92
    R2 Physiographic:         y 148 – 204  (ellipses cy=176)
    R3 Pioneer vegetation:    y 252 – 330  (grasses group taller)
    R4 Conifers:              y 372 – 446  (pines group taller)
    R5 Climax dominants:      y 490 – 578

  NODE CENTRES X:
    Damp depression:   cx 185
    Upper beach:       cx 315
    Eroding surfaces:  cx 472
    Depositing crests: cx 634
    Steep pockets:     cx 820

    Foredune:          cx 315
    Blowout:           cx 720

    Rush meadow:       cx 175
    Cottonwood:        cx 315
    Marram group:      cx 460  (left edge 390, right edge 536)
    Shrubs:            cx 660
    Basswood:          cx 840

    Pines group:       cx 460  (left edge 390, right edge 536)
    Arbor vitae:       cx 668  (shares right border with Balsam fir)
    Balsam fir:        cx 778  (left edge = right edge of Arbor vitae)

    Tall grass prairie: cx 158
    Red maple swamp:    cx 272
    Black/White oak:    cx 398
    Oaks R/W:           cx 512
    Maples:             cx 618  ┐
    Beech:              cx 702  ├ share borders (no gap)
    Hemlock:            cx 782  ┘
    Birches:            cx 890
  ═══════════════════════════════════════════════════════
  -->

  <svg id="fig38svg" viewBox="0 0 1050 660" width="100%"
       style="display:block;background:#fff;border-radius:6px;border:1px solid #d8e8d8;">

    <defs>
      <!-- Normal arrowhead -->
      <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5"
              markerWidth="5" markerHeight="5" orient="auto">
        <path d="M1,2 L9,5 L1,8" fill="none" stroke="#333"
              stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
      <!-- Highlight arrowhead (orange) -->
      <marker id="aho" viewBox="0 0 10 10" refX="9" refY="5"
              markerWidth="5" markerHeight="5" orient="auto">
        <path d="M1,2 L9,5 L1,8" fill="none" stroke="#d35400"
              stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>

    <!-- ─────────────────────────────────────
         ROW LABELS
    ───────────────────────────────────── -->
    <text x="4" y="64"  font-size="12" fill="#444" font-family="Arial">Initial</text>
    <text x="4" y="79"  font-size="12" fill="#444" font-family="Arial">conditions</text>
    <text x="4" y="162" font-size="12" fill="#444" font-family="Arial">Physiographic</text>
    <text x="4" y="177" font-size="12" fill="#444" font-family="Arial">processes</text>
    <text x="4" y="268" font-size="12" fill="#444" font-family="Arial">Pioneer</text>
    <text x="4" y="283" font-size="12" fill="#444" font-family="Arial">vegetation</text>
    <text x="4" y="385" font-size="12" fill="#444" font-family="Arial">Conifers</text>
    <text x="4" y="400" font-size="12" fill="#444" font-family="Arial">(mostly</text>
    <text x="4" y="415" font-size="12" fill="#444" font-family="Arial">temporary)</text>
    <text x="4" y="510" font-size="12" fill="#444" font-family="Arial">'Climax'</text>
    <text x="4" y="525" font-size="12" fill="#444" font-family="Arial">dominants</text>

    <!-- Vertical divider -->
    <line x1="110" y1="40" x2="110" y2="600" stroke="#bbb" stroke-width="1"/>

    <!-- ═══════════════════════════════════
         ROW 1 — INITIAL CONDITIONS
         y=46–92
    ═══════════════════════════════════ -->

    <!-- Damp depression  x=120 w=130 cx=185 -->
    <g class="n" id="n-damp"
       data-t="Damp depression"
       data-i="Low-lying wet inter-dune areas with high water table. Support hydrophytic rush communities leading to tall grass prairie or red maple swamp as climax vegetation.">
      <rect x="120" y="46" width="130" height="46" rx="3" fill="#e4efe4" stroke="#4a7a4a" stroke-width="1"/>
      <text text-anchor="middle" x="185" y="65" font-size="12.5" font-family="Arial" fill="#222">Damp</text>
      <text text-anchor="middle" x="185" y="81" font-size="12.5" font-family="Arial" fill="#222">depression</text>
    </g>

    <!-- Upper beach  x=270 w=90 cx=315 -->
    <g class="n" id="n-upper"
       data-t="Upper beach"
       data-i="Dry exposed upper beach — mobile and unstable. Initiates foredune formation through Ammophila colonisation. Bidirectionally linked with damp depression.">
      <rect x="270" y="46" width="90" height="46" rx="3" fill="#e4efe4" stroke="#4a7a4a" stroke-width="1"/>
      <text text-anchor="middle" x="315" y="65" font-size="12.5" font-family="Arial" fill="#222">Upper</text>
      <text text-anchor="middle" x="315" y="81" font-size="12.5" font-family="Arial" fill="#222">beach</text>
    </g>

    <!-- Eroding surfaces  x=414 w=116 cx=472 -->
    <g class="n" id="n-erode"
       data-t="Eroding surfaces"
       data-i="Active wind-eroded dune faces where continuous sand removal prevents stable plant establishment. Connected to blowout initiation by dashed feedback arrows.">
      <rect x="414" y="46" width="116" height="46" rx="3" fill="#e4efe4" stroke="#4a7a4a" stroke-width="1"/>
      <text text-anchor="middle" x="472" y="65" font-size="12.5" font-family="Arial" fill="#222">Eroding</text>
      <text text-anchor="middle" x="472" y="81" font-size="12.5" font-family="Arial" fill="#222">surfaces</text>
    </g>

    <!-- Depositing crests  x=576 w=116 cx=634 -->
    <g class="n" id="n-deposit"
       data-t="Depositing crests"
       data-i="Dune crests where wind actively deposits sand. Subject to blowout initiation; can stabilise to support marram grass and pioneer communities.">
      <rect x="576" y="46" width="116" height="46" rx="3" fill="#e4efe4" stroke="#4a7a4a" stroke-width="1"/>
      <text text-anchor="middle" x="634" y="65" font-size="12.5" font-family="Arial" fill="#222">Depositing</text>
      <text text-anchor="middle" x="634" y="81" font-size="12.5" font-family="Arial" fill="#222">crests</text>
    </g>

    <!-- Steep pockets / lee slopes  x=752 w=136 cx=820 -->
    <g class="n" id="n-lee"
       data-t="Steep pockets / lee slopes"
       data-i="Sheltered lee slopes behind dune crests. Accumulate organic matter rapidly and support basswood directly, leading to the mesic forest climax without a prominent pine stage.">
      <rect x="752" y="46" width="136" height="46" rx="3" fill="#e4efe4" stroke="#4a7a4a" stroke-width="1"/>
      <text text-anchor="middle" x="820" y="65" font-size="12.5" font-family="Arial" fill="#222">Steep pockets</text>
      <text text-anchor="middle" x="820" y="81" font-size="12.5" font-family="Arial" fill="#222">lee slopes</text>
    </g>

    <!-- ═══════════════════════════
         ROW 1 ARROWS
         From original:
         • Upper beach ←→ Damp depression  (solid bidirectional)
         • Large dashed arc: Eroding surfaces sweeps up and over → Damp depression
         • Dashed from Eroding/Depositing area → Blowout (crossing diagonals)
         • Dashed from Depositing → back to Eroding (leftward at top)
         • Dashed Steep pockets → Blowout
    ═══════════════════════════ -->

    <!-- Upper beach → Damp depression (solid, left) -->
    <line class="al" data-p="upper damp"
          x1="270" y1="64" x2="252" y2="64"
          stroke="#333" stroke-width="1.3" marker-end="url(#ah)"/>
    <!-- Damp depression → Upper beach (solid, right, offset y) -->
    <line class="al" data-p="upper damp"
          x1="250" y1="76" x2="269" y2="76"
          stroke="#333" stroke-width="1.3" marker-end="url(#ah)"/>

    <!-- Large dashed arc: Eroding surfaces → Damp depression (sweeps over top) -->
    <path class="al" data-p="upper damp"
          d="M 434 46 Q 310 4 252 50"
          fill="none" stroke="#333" stroke-width="1.3"
          stroke-dasharray="7 4" marker-end="url(#ah)"/>

    <!-- Dashed: Depositing crests → Eroding surfaces (leftward dashed at top level) -->
    <path class="al" data-p="blowout"
          d="M 576 60 Q 548 44 532 50"
          fill="none" stroke="#333" stroke-width="1.3"
          stroke-dasharray="7 4" marker-end="url(#ah)"/>

    <!-- Dashed crossing lines: Eroding/Depositing → Blowout initiation (two crossing diagonals) -->
    <!-- From Eroding surfaces bottom-right → Blowout -->
    <path class="al" data-p="blowout"
          d="M 530 92 Q 600 130 660 150"
          fill="none" stroke="#333" stroke-width="1.3"
          stroke-dasharray="7 4" marker-end="url(#ah)"/>
    <!-- From Depositing crests bottom-left → Blowout (crosses the above) -->
    <path class="al" data-p="blowout"
          d="M 634 92 Q 660 125 688 152"
          fill="none" stroke="#333" stroke-width="1.3"
          stroke-dasharray="7 4" marker-end="url(#ah)"/>

    <!-- Dashed Blowout → Depositing crests (back up, dashed) -->
    <path class="al" data-p="blowout"
          d="M 718 152 Q 722 100 712 92"
          fill="none" stroke="#333" stroke-width="1.3"
          stroke-dasharray="7 4" marker-end="url(#ah)"/>

    <!-- Dashed Steep pockets → Blowout -->
    <path class="al" data-p="blowout lee"
          d="M 772 82 Q 758 120 752 152"
          fill="none" stroke="#333" stroke-width="1.3"
          stroke-dasharray="7 4" marker-end="url(#ah)"/>

    <!-- ═══════════════════════════════════
         ROW 2 — PHYSIOGRAPHIC PROCESSES
    ═══════════════════════════════════ -->

    <!-- Foredune Initiation ellipse  cx=315 cy=176 rx=82 ry=26 -->
    <g class="n" id="n-foredune"
       data-t="Foredune Initiation"
       data-i="Early dune building by pioneer grasses trapping wind-blown sand. Ammophila arenaria colonises the upper beach and builds the foredune, leading to cottonwood and marram grass communities.">
      <ellipse cx="315" cy="176" rx="82" ry="26" fill="#d6e8d6" stroke="#4a7a4a" stroke-width="1"/>
      <text text-anchor="middle" x="315" y="172" font-size="12.5" font-family="Arial" fill="#222">Foredune</text>
      <text text-anchor="middle" x="315" y="187" font-size="12.5" font-family="Arial" fill="#222">Initiation</text>
    </g>

    <!-- Blowout Initiation ellipse  cx=720 cy=176 rx=82 ry=26 -->
    <g class="n" id="n-blowout-node"
       data-t="Blowout Initiation"
       data-i="Wind scouring creates bowl-shaped blowout depressions. Blowouts may re-expose bare sand, restarting succession, or develop into new landforms. They feed into marram grasses, shrubs and grasses.">
      <ellipse cx="720" cy="176" rx="82" ry="26" fill="#d6e8d6" stroke="#4a7a4a" stroke-width="1"/>
      <text text-anchor="middle" x="720" y="172" font-size="12.5" font-family="Arial" fill="#222">Blowout</text>
      <text text-anchor="middle" x="720" y="187" font-size="12.5" font-family="Arial" fill="#222">Initiation</text>
    </g>

    <!-- ROW 2 ARROWS -->
    <!-- Upper beach → Foredune (straight down, hits top of ellipse) -->
    <line class="al" data-p="upper"
          x1="315" y1="92" x2="315" y2="150"
          stroke="#333" stroke-width="1.3" marker-end="url(#ah)"/>

    <!-- Damp depression → Foredune (curve right-down) -->
    <path class="al" data-p="damp"
          d="M 185 92 Q 210 148 235 162"
          fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#ah)"/>

    <!-- ═══════════════════════════════════
         ROW 3 — PIONEER VEGETATION
         y=252–330
    ═══════════════════════════════════ -->

    <!-- Rush meadow  x=120 w=110 cx=175 -->
    <g class="n" id="n-rush"
       data-t="Rush meadow"
       data-i="Hydrophytic rush communities in damp depressions. Lead to tall grass prairie or red maple swamp depending on drainage conditions.">
      <rect x="120" y="252" width="110" height="46" rx="3" fill="#eaf4ea" stroke="#4a7a4a" stroke-width="1"/>
      <text text-anchor="middle" x="175" y="271" font-size="12.5" font-family="Arial" fill="#222">Rush</text>
      <text text-anchor="middle" x="175" y="287" font-size="12.5" font-family="Arial" fill="#222">meadow</text>
    </g>

    <!-- Cottonwood  x=262 w=106 cx=315 -->
    <g class="n" id="n-cotton"
       data-t="Cottonwood"
       data-i="Eastern cottonwood (Populus deltoides) colonises mobile sand rapidly after foredune initiation. Bidirectionally linked with the marram/sand reed group.">
      <rect x="262" y="252" width="106" height="46" rx="3" fill="#eaf4ea" stroke="#4a7a4a" stroke-width="1"/>
      <text text-anchor="middle" x="315" y="279" font-size="12.5" font-family="Arial" fill="#222">Cottonwood</text>
    </g>

    <!--
      Marram / Sand reed / Little bluestem — stacked boxes with LEFT curly brace
      Left edge x=390, width=146, right edge x=536
      Marram:         y=252–274
      Sand reed:      y=276–298
      Little bluestem:y=300–322
    -->
    <g class="n" id="n-marram"
       data-t="Marram / Sand reed / Little bluestem"
       data-i="Key dune-stabilising grasses. Marram (Ammophila breviligulata) is the primary sand-binder. Sand reed (Calamovilfa longifolia) and Little bluestem (Schizachyrium scoparium) follow as the dune stabilises. These bridge physiographic processes and conifer establishment.">
      <rect x="390" y="252" width="146" height="24" rx="2" fill="#eaf4ea" stroke="#4a7a4a" stroke-width="1"/>
      <text text-anchor="middle" x="463" y="268" font-size="12" font-family="Arial" fill="#222">Marram</text>
      <rect x="390" y="278" width="146" height="24" rx="2" fill="#eaf4ea" stroke="#4a7a4a" stroke-width="1"/>
      <text text-anchor="middle" x="463" y="294" font-size="12" font-family="Arial" fill="#222">Sand reed</text>
      <rect x="390" y="304" width="146" height="24" rx="2" fill="#eaf4ea" stroke="#4a7a4a" stroke-width="1"/>
      <text text-anchor="middle" x="463" y="320" font-size="12" font-family="Arial" fill="#222">Little bluestem</text>
    </g>
    <!-- LEFT curly brace for Marram group -->
    <path d="M 388,252 Q 376,252 376,264 Q 376,276 388,276 Q 376,276 376,288 Q 376,300 388,300 Q 376,300 376,312 Q 376,324 388,324"
          fill="none" stroke="#4a7a4a" stroke-width="1.3"/>

    <!-- "Grasses" italic label -->
    <text x="548" y="292" font-size="12" font-family="Arial" fill="#444" font-style="italic">Grasses</text>

    <!-- Shrubs  x=610 w=100 cx=660 -->
    <g class="n" id="n-shrubs"
       data-t="Shrubs"
       data-i="Shrub communities including bearberry, sandcherry and willows on stabilising dunes. Receive inputs from the grasses stage and blowout initiation. Lead to arbor vitae and balsam fir.">
      <rect x="610" y="252" width="100" height="46" rx="3" fill="#eaf4ea" stroke="#4a7a4a" stroke-width="1"/>
      <text text-anchor="middle" x="660" y="279" font-size="12.5" font-family="Arial" fill="#222">Shrubs</text>
    </g>

    <!-- Basswood  x=762 w=116 cx=820 -->
    <g class="n" id="n-bass"
       data-t="Basswood"
       data-i="American basswood (Tilia americana) on sheltered lee slopes. Colonises directly from steep lee slope conditions without a prominent conifer stage. Has a long branching arrow leading to oaks, maples, beech and hemlock at the climax level.">
      <rect x="762" y="252" width="116" height="46" rx="3" fill="#eaf4ea" stroke="#4a7a4a" stroke-width="1"/>
      <text text-anchor="middle" x="820" y="279" font-size="12.5" font-family="Arial" fill="#222">Basswood</text>
    </g>

    <!-- ROW 3 ARROWS -->

    <!-- Damp depression straight down → Rush meadow -->
    <line class="al" data-p="damp"
          x1="175" y1="92" x2="175" y2="252"
          stroke="#333" stroke-width="1.3" marker-end="url(#ah)"/>

    <!-- Foredune → Cottonwood (straight down) -->
    <line class="al" data-p="upper"
          x1="315" y1="202" x2="315" y2="252"
          stroke="#333" stroke-width="1.3" marker-end="url(#ah)"/>

    <!-- Foredune → Marram group top (diagonal right) -->
    <path class="al" data-p="upper"
          d="M 368 190 Q 405 222 416 252"
          fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#ah)"/>

    <!-- Cottonwood ↔ Marram bidirectional -->
    <!-- Cottonwood → Marram -->
    <line class="al" data-p="upper"
          x1="368" y1="270" x2="388" y2="268"
          stroke="#333" stroke-width="1.3" marker-end="url(#ah)"/>
    <!-- Marram → Cottonwood -->
    <line class="al" data-p="upper"
          x1="388" y1="282" x2="368" y2="284"
          stroke="#333" stroke-width="1.3" marker-end="url(#ah)"/>

    <!-- Blowout → Marram group (long dashed diagonal — from left side of blowout ellipse) -->
    <path class="al" data-p="blowout"
          d="M 646 190 Q 575 228 538 258"
          fill="none" stroke="#333" stroke-width="1.3"
          stroke-dasharray="7 4" marker-end="url(#ah)"/>

    <!-- Blowout → Shrubs (dashed, shorter diagonal) -->
    <path class="al" data-p="blowout"
          d="M 762 186 Q 738 222 712 252"
          fill="none" stroke="#333" stroke-width="1.3"
          stroke-dasharray="7 4" marker-end="url(#ah)"/>

    <!-- Grasses → Shrubs (solid horizontal, from "Grasses" label area to Shrubs left edge) -->
    <line class="al" data-p="blowout upper"
          x1="604" y1="279" x2="612" y2="279"
          stroke="#333" stroke-width="1.3" marker-end="url(#ah)"/>

    <!-- Shrubs → Basswood (solid horizontal) -->
    <line class="al" data-p="lee blowout"
          x1="710" y1="275" x2="760" y2="275"
          stroke="#333" stroke-width="1.3" marker-end="url(#ah)"/>

    <!-- Steep pockets → Basswood (straight down) -->
    <line class="al" data-p="lee"
          x1="820" y1="92" x2="820" y2="252"
          stroke="#333" stroke-width="1.3" marker-end="url(#ah)"/>

    <!-- ═══════════════════════════════════
         ROW 4 — CONIFERS
         y=372–446
    ═══════════════════════════════════ -->

    <!--
      Pines: Jack / White / Red — stacked boxes with LEFT curly brace
      Left edge x=390, width=146, right edge x=536
    -->
    <g class="n" id="n-pines"
       data-t="Pines (Jack, White, Red)"
       data-i="Jack pine (Pinus banksiana), White pine (P. strobus) and Red pine (P. resinosa) form a temporary conifer stage. They prepare soil for mesic hardwood species. Succession diverges to black/white oak on drier sites, or maples, beech and hemlock on mesic sites.">

<div id="fig38-tip"></div>

<script>
(function(){
  const tip    = document.getElementById('fig38-tip');
  const panel  = document.getElementById('fig38-panel');
  const pTitle = document.getElementById('panel-title');
  const pBody  = document.getElementById('panel-body');

  /* ── Tooltip + click ── */
  document.querySelectorAll('#fig38svg .n').forEach(nd => {
    nd.addEventListener('mouseenter', () => {
      tip.textContent = nd.getAttribute('data-t') || '';
      tip.style.opacity = '1';
    });
    nd.addEventListener('mousemove', e => {
      tip.style.left = (e.clientX + 14) + 'px';
      tip.style.top  = (e.clientY - 34) + 'px';
    });
    nd.addEventListener('mouseleave', () => { tip.style.opacity = '0'; });
    nd.addEventListener('click', () => {
      pTitle.textContent = nd.getAttribute('data-t') || '';
      pBody.textContent  = nd.getAttribute('data-i') || '';
      panel.classList.add('open');
      document.querySelectorAll('#fig38svg .n').forEach(x => x.classList.remove('sel'));
      nd.classList.add('sel');
    });
  });

  window.closePanel = function(){
    panel.classList.remove('open');
    document.querySelectorAll('#fig38svg .n').forEach(x => x.classList.remove('sel'));
  };

  /* ── Pathway highlight ── */
  window.hilite = function(path){
    const lines = document.querySelectorAll('#fig38svg .al');
    document.querySelectorAll('.fig-controls button').forEach(b => b.classList.remove('active'));

    if(!path){
      lines.forEach(l => {
        l.classList.remove('dim','hi');
        l.setAttribute('marker-end','url(#ah)');
      });
      document.getElementById('b-all').classList.add('active');
      return;
    }

    const bmap = { damp:'b-damp', upper:'b-upper', blowout:'b-blowout', lee:'b-lee' };
    if(bmap[path]) document.getElementById(bmap[path]).classList.add('active');

    lines.forEach(l => {
      const ps = (l.getAttribute('data-p') || '').split(' ');
      if(ps.includes(path)){
        l.classList.remove('dim'); l.classList.add('hi');
        l.setAttribute('marker-end','url(#aho)');
      } else {
        l.classList.add('dim'); l.classList.remove('hi');
        l.setAttribute('marker-end','url(#ah)');
      }
    });
  };

  document.getElementById('b-all').classList.add('active');
})();
</script>
