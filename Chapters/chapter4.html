<div id="infopanel">
  <span id="iclose" onclick="cp()">×</span>
  <strong id="ititle"></strong>
  <p id="ibody"></p>
</div>

<figcaption>
  <strong>Fig. 3.8</strong> Schematic alternative dune successions in the Lake Michigan dune systems. (From Olson, 1958; courtesy of <em>Bot. Gaz.</em>)<br>
  <span style="font-style:normal;font-size:11px;color:#999;">Hover any box · Click for full description · Pathway buttons highlight routes</span>
</figcaption>
</figure>
<div id="tip"></div>

<script>
(function(){
  const tip=document.getElementById('tip');
  const panel=document.getElementById('infopanel');
  const iT=document.getElementById('ititle');
  const iB=document.getElementById('ibody');

  document.querySelectorAll('#svg .N').forEach(nd=>{
    nd.addEventListener('mouseenter',()=>{ tip.textContent=nd.getAttribute('data-t')||''; tip.style.opacity='1'; });
    nd.addEventListener('mousemove',e=>{ tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY-34)+'px'; });
    nd.addEventListener('mouseleave',()=>{ tip.style.opacity='0'; });
    nd.addEventListener('click',()=>{
      iT.textContent=nd.getAttribute('data-t')||'';
      iB.textContent=nd.getAttribute('data-i')||'';
      panel.classList.add('open');
      document.querySelectorAll('#svg .N').forEach(x=>x.classList.remove('sel'));
      nd.classList.add('sel');
    });
  });

  window.cp=function(){
    panel.classList.remove('open');
    document.querySelectorAll('#svg .N').forEach(x=>x.classList.remove('sel'));
  };

  window.hl=function(p){
    const arrows=document.querySelectorAll('#svg .A');
    document.querySelectorAll('.controls button').forEach(b=>b.classList.remove('on'));
    if(!p){
      arrows.forEach(a=>{
        a.classList.remove('dim','hi');
        if(a.hasAttribute('marker-end')) a.setAttribute('marker-end','url(#ah)');
        if(a.getAttribute('data-dh'))    a.setAttribute('marker-start','url(#ahrev)');
        else                              a.removeAttribute('marker-start');
      });
      document.getElementById('b-all').classList.add('on');
      return;
    }
    const bmap={damp:'b-damp',upper:'b-upper',erode:'b-erode',deposit:'b-deposit',lee:'b-lee'};
    if(bmap[p]) document.getElementById(bmap[p]).classList.add('on');
    arrows.forEach(a=>{
      const ps=(a.getAttribute('data-p')||'').split(' ');
      if(ps.includes(p)){
        a.classList.remove('dim'); a.classList.add('hi');
        if(a.hasAttribute('marker-end')) a.setAttribute('marker-end','url(#aho)');
        if(a.getAttribute('data-dh'))    a.setAttribute('marker-start','url(#ahorev)');
      } else {
        a.classList.add('dim'); a.classList.remove('hi');
        if(a.hasAttribute('marker-end')) a.setAttribute('marker-end','url(#ah)');
        if(a.getAttribute('data-dh'))    a.setAttribute('marker-start','url(#ahrev)');
      }
    });
  };

  document.getElementById('b-all').classList.add('on');
})();
</script>
