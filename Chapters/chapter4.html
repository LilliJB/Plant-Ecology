<figcaption>
  <strong>Fig. 3.8</strong> Schematic alternative dune successions in the Lake Michigan dune systems. (From Olson, 1958; courtesy of <em>Bot. Gaz.</em>)<br>
  <span style="font-style:normal;font-size:11px;color:#999;">Use the buttons above to highlight individual successional pathways</span>
</figcaption>
</figure>

<script>
(function(){
  const isDashed = el => (el.getAttribute('stroke-dasharray') || '').trim().length > 0;
  const hasEnd   = el => !!el.getAttribute('marker-end');
  const hasStart = el => !!el.getAttribute('marker-start');

  // Full cascade sets: each key lists ALL tags that should be highlighted
  // when that initial condition button is pressed (including all indirect downstream routes)
  const CASCADE = {
    // Damp depression → Rush meadow → Tall grass / Red maple swamp
    // Also → Cottonwood → (all upper pathways downstream)
    damp:    ['damp','upper','upper erode','upper erode deposit','upper erode deposit lee','upper deposit','upper damp'],

    // Upper beach → Foredune → Marram → Pines → climax
    // Cottonwood is also fed by damp but upper beach feeds it via Foredune
    upper:   ['upper','upper erode','upper erode deposit','upper erode deposit lee','upper deposit','upper damp'],

    // Eroding surfaces → Sand reed → LB → Pines → climax
    erode:   ['erode','upper erode','upper erode deposit','upper erode deposit lee','erode damp'],

    // Depositing crests → Marram / Blowout → Grasses → Shrubs → Arbor/Balsam → climax
    deposit: ['deposit','deposit erode','deposit lee','upper erode deposit','upper erode deposit lee','upper deposit','lee deposit'],

    // Lee slopes → Shrubs / Basswood → Arbor/Balsam → climax
    lee:     ['lee','lee deposit','upper erode deposit lee','deposit lee'],
  };

  // Check if arrow's data-p overlaps with any of the active tags
  function matches(el, activeTags) {
    const ps = (el.getAttribute('data-p') || '').split(' ');
    // Arrow matches if ANY of its tags is in active set, OR if its full data-p string is in active set
    const dp = el.getAttribute('data-p') || '';
    return activeTags.some(tag => ps.includes(tag) || dp === tag);
  }

  window.hl = function(p) {
    const arrows = document.querySelectorAll('#svg .A');
    document.querySelectorAll('.controls button').forEach(b => b.classList.remove('on'));

    if (!p) {
      arrows.forEach(a => {
        a.classList.remove('dim','hi');
        const d = isDashed(a);
        if (hasEnd(a))   a.setAttribute('marker-end',   d ? 'url(#ahd)'    : 'url(#ah)');
        if (hasStart(a)) a.setAttribute('marker-start', d ? 'url(#ahdrev)' : 'url(#ahrev)');
      });
      document.getElementById('b-all').classList.add('on');
      return;
    }

    const bmap = { damp:'b-damp', upper:'b-upper', erode:'b-erode', deposit:'b-deposit', lee:'b-lee' };
    if (bmap[p]) document.getElementById(bmap[p]).classList.add('on');

    const activeTags = CASCADE[p] || [p];

    arrows.forEach(a => {
      const d = isDashed(a);
      if (matches(a, activeTags)) {
        a.classList.remove('dim'); a.classList.add('hi');
        if (hasEnd(a))   a.setAttribute('marker-end',   d ? 'url(#ahod)'   : 'url(#aho)');
        if (hasStart(a)) a.setAttribute('marker-start', d ? 'url(#ahod)'   : 'url(#ahorev)');
      } else {
        a.classList.add('dim'); a.classList.remove('hi');
        if (hasEnd(a))   a.setAttribute('marker-end',   d ? 'url(#ahd)'    : 'url(#ah)');
        if (hasStart(a)) a.setAttribute('marker-start', d ? 'url(#ahdrev)' : 'url(#ahrev)');
      }
    });
  };

  document.getElementById('b-all').classList.add('on');
})();
</script>
