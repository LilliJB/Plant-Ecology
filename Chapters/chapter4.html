<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dune System Interactive Suite</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #acd8af;
}

/* ===== DROPDOWNS ===== */
.section {
    margin: 10px;
    border-radius: 8px;
    overflow: hidden;
}

.section button {
    width: 100%;
    padding: 15px;
    font-size: 16px;
    background: #2f5d3a;
    color: white;
    border: none;
    cursor: pointer;
}

.section-content {
    display: none;
    background: white;
}

/* ===== SVG ===== */
svg {
    width: 100%;
    height: 500px;
    background: white;
}

/* ===== NODES ===== */
.node rect {
    stroke: #333;
    rx: 6;
}

.initial rect { fill: #eee; }
.process rect { fill: #cfe8ff; }
.pioneer rect { fill: #c8f7c5; }
.conifer rect { fill: #fff3b0; }
.climax rect { fill: #ffc6c6; }

.node.active rect { fill: #7ee081 !important; }

/* edges */
.edge {
    stroke: #666;
    stroke-width: 1.5;
    marker-end: url(#arrow);
}
.edge.active {
    stroke: #2f5d3a;
    stroke-width: 3;
}

/* quiz */
.correct { fill: #4caf50 !important; }
.wrong { fill: #f44336 !important; }

/* sidebar */
.sidebar {
    padding: 10px;
    font-size: 14px;
}
</style>
</head>

<body>

<!-- ===== BASE ===== -->
<div class="section">
<button onclick="toggle(this)">Base Interactive</button>
<div class="section-content">

<div class="sidebar">Tap nodes to explore</div>
<svg id="baseSVG" viewBox="0 0 1000 600"></svg>

</div>
</div>

<!-- ===== QUIZ ===== -->
<div class="section">
<button onclick="toggle(this)">Quiz Mode</button>
<div class="section-content">

<div class="sidebar">
Score: <span id="score">0</span><br>
Click succession in correct order
</div>

<svg id="quizSVG" viewBox="0 0 1000 600"></svg>

</div>
</div>

<!-- ===== ANIMATION ===== -->
<div class="section">
<button onclick="toggle(this)">Animated Mode</button>
<div class="section-content">

<div class="sidebar">Auto-playing succession</div>
<svg id="animSVG" viewBox="0 0 1000 600"></svg>

</div>
</div>

<script>
function toggle(btn){
const content = btn.nextElementSibling;
content.style.display = content.style.display === "block" ? "none" : "block";
}

/* ===== COMMON GRAPH ===== */
const nodesData = [
{id:"damp",x:50,y:50,stage:"initial",label:"Damp"},
{id:"beach",x:200,y:50,stage:"initial",label:"Beach"},
{id:"marram",x:400,y:200,stage:"pioneer",label:"Marram"},
{id:"shrubs",x:650,y:200,stage:"pioneer",label:"Shrubs"},
{id:"pines",x:450,y:350,stage:"conifer",label:"Pines"},
{id:"oaks",x:700,y:450,stage:"climax",label:"Oaks"}
];

const edgesData = [
["damp","beach"],
["beach","marram"],
["marram","shrubs"],
["marram","pines"],
["pines","oaks"],
["shrubs","oaks"]
];

function createGraph(svg){
svg.innerHTML = `
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="3" orient="auto">
<path d="M0,0 L10,3 L0,6 Z" fill="#666"/>
</marker>
</defs>`;

const g = document.createElementNS("http://www.w3.org/2000/svg","g");
svg.appendChild(g);

const nodeMap = {};

nodesData.forEach(n=>{
const node = document.createElementNS("http://www.w3.org/2000/svg","g");
node.setAttribute("class","node "+n.stage);
node.setAttribute("transform",`translate(${n.x},${n.y})`);
node.dataset.id=n.id;

node.innerHTML = `
<rect width="100" height="40"></rect>
<text x="50" y="20">${n.label}</text>
`;

g.appendChild(node);
nodeMap[n.id]=node;
});

edgesData.forEach(([a,b])=>{
const na = nodesData.find(n=>n.id===a);
const nb = nodesData.find(n=>n.id===b);

const line = document.createElementNS("http://www.w3.org/2000/svg","line");
line.setAttribute("class","edge");
line.setAttribute("x1",na.x+100);
line.setAttribute("y1",na.y+20);
line.setAttribute("x2",nb.x);
line.setAttribute("y2",nb.y+20);
g.appendChild(line);
});

return {nodeMap,g};
}

/* ===== BASE INTERACTION ===== */
const base = createGraph(document.getElementById("baseSVG"));
Object.values(base.nodeMap).forEach(n=>{
n.addEventListener("click",()=>n.classList.toggle("active"));
});

/* ===== QUIZ ===== */
const quiz = createGraph(document.getElementById("quizSVG"));
const order = ["damp","beach","marram","pines","oaks"];
let step=0,score=0;

Object.values(quiz.nodeMap).forEach(n=>{
n.addEventListener("click",()=>{
const id=n.dataset.id;

if(id===order[step]){
n.querySelector("rect").classList.add("correct");
step++;
score++;
document.getElementById("score").textContent=score;
}else{
n.querySelector("rect").classList.add("wrong");
setTimeout(()=>n.querySelector("rect").classList.remove("wrong"),500);
}
});
});

/* ===== ANIMATION ===== */
const anim = createGraph(document.getElementById("animSVG"));

let i=0;
const animOrder=["damp","beach","marram","pines","oaks"];

setInterval(()=>{
Object.values(anim.nodeMap).forEach(n=>n.classList.remove("active"));
anim.nodeMap[animOrder[i]].classList.add("active");
i=(i+1)%animOrder.length;
},1200);

/* ===== TOUCH ZOOM ===== */
document.querySelectorAll("svg").forEach(svg=>{
let scale=1,panX=0,panY=0;
let lastDist=0;

svg.addEventListener("touchmove",e=>{
if(e.touches.length===2){
let dx=e.touches[0].clientX-e.touches[1].clientX;
let dy=e.touches[0].clientY-e.touches[1].clientY;
let dist=Math.sqrt(dx*dx+dy*dy);

if(lastDist){
scale*=dist/lastDist;
}
lastDist=dist;

svg.style.transform=`scale(${scale})`;
}
},{passive:false});
});
</script>

</body>
</html>
